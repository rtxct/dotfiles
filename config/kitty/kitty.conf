include ./dark-theme.auto.conf

shell /usr/bin/zsh

# Kitty's
confirm_os_window_close 0
enable_audio_bell no
enable_mouse_wheel_zoom yes

# Font
font_family JetBrainsMono Nerd Font
font_size 16
font_features +liga +clig

bold_font JetBrainsMono Nerd Font
italic_font JetBrainsMono Nerd Font
bold_italic_font JetBrainsMono Nerd Font

# Display
background_opacity 0.9
window_padding_width 10 20

dynamic_background_opacity yes
kitty @ set-background-opacity +0.05
kitty @ set-background-opacity -0.05

# shell_integration no-cursor
# cursor_shape block
cursor_trail 3
cursor_trail_decay 0.1 0.4

# Mappings
# map ctrl+shift+t new_tab
# map ctrl+shift+right next_tab
# map ctrl+shift+left previous_tab
# map ctrl+shift+w close_tab
# map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+up   set_background_opacity +0.05
map ctrl+shift+down set_background_opacity -0.05
map ctrl+shift+0    set_background_opacity 1

# Better latency
input_delay 0
repaint_delay 2
sync_to_monitor no
wayland_enable_ime no

