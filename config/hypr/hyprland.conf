# Defaults
$terminal = kitty
$menu = rofi -show drun
$locker = hyprlock
$passManager = 1password
$fileManager = dolphin
$waybarToggle = ~/.config/hypr/scripts/toggle_waybar.sh

source = ~/.config/hypr/hyprland/hypr-monitors.conf
source = ~/.config/hypr/hyprland/hypr-exec.conf
source = ~/.config/hypr/hyprland/hypr-customization.conf
source = ~/.config/hypr/hyprland/hypr-binds.conf
source = ~/.config/hypr/hyprland/hypr-rules.conf
source = ~/.config/hypr/hyprland/hypr-env.conf

source = ~/.config/hypr/animations/*.conf
