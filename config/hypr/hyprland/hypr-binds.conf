# Global binders
$mainMod = ALT

binds {
    movefocus_cycles_fullscreen = true
}

# Default openers
bind = $mainMod SHIFT, I, exec, $locker
bind = $mainMod, ESCAPE, exec, $passManager
bind = $mainMod, T, exec, $fileManager

bind = $mainMod, Y, exec, $waybarToggle

bind = $mainMod, Tab, exec, rofi -show window
bind = $mainMod, BACKSPACE, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, C, exec, rofi -show calc

# Default actions
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,

# Window adjustment
bind = $mainMod, F, fullscreen
bind = $mainMod, E, exec, $menu
bind = $mainMod, B, pseudo
bind = $mainMod, N, togglesplit
bind = $mainMod SHIFT, SPACE, togglefloating,

# Move focus with mainMod + vim keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Move focus with mainMod + arrow keys
bind = $mainMod, LEFT, movefocus, l
bind = $mainMod, DOWN, movefocus, d
bind = $mainMod, UP, movefocus, u
bind = $mainMod, RIGHT, movefocus, r

# Change window position with mainMod + vim keys
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, J, movewindow, d
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, L, movewindow, r

# Change window position with mainMod + arrow keys
bind = $mainMod SHIFT, LEFT, movewindow, l
bind = $mainMod SHIFT, DOWN, movewindow, d
bind = $mainMod SHIFT, UP, movewindow, u
bind = $mainMod SHIFT, RIGHT, movewindow, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9] (silently)
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Resizing
bind = $mainMod, R, submap, resize
submap = resize

# Resizing the active window mainMod + vim keys
bind = , L, resizeactive, 50 0
bind = , H, resizeactive, -50 0
bind = , K, resizeactive, 0 -50
bind = , J, resizeactive, 0 50

# Resizing the active window mainMod + arrow keys
bind = , LEFT, resizeactive, 50 0
bind = , DOWN, resizeactive, 0 50
bind = , UP, resizeactive, 0 -50
bind = , RIGHT, resizeactive, -50 0

# Reset to global supmap after resizing
bind = , escape, submap, reset
submap = reset

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Custom bindings
bind = $mainMod SHIFT, P, exec, shutdown 0

bind = $mainMod, X, exec, env WAYLAND_DISPLAY=$WAYLAND_DISPLAY bash -c 'region=$(slurp); [ -n "$region" ] && grim -g "$region" - | satty --filename - --copy-command wl-copy'
bind = $mainMod SHIFT, X, exec, monitor=$(hyprctl monitors -j | jq -r '.[] | select(.focused == true) | .name') && grim -o "$monitor" ~/Screenshots/full_$(date +'%Y-%m-%d_%H:%M:%S').png

bind = $mainMod, down, exec, playerctl --player=spotify play-pause
bind = $mainMod, right, exec, playerctl --player=spotify next
bind = $mainMod, left, exec, playerctl --player=spotify previous

bind = $mainMod SHIFT, EQUAL, exec, brightnessctl set +10%
bind = $mainMod SHIFT, MINUS, exec, brightnessctl set 10%-

bind = $mainMod CONTROL, EQUAL, exec, amixer sset Master 5%+
bind = $mainMod CONTROL, MINUS, exec, amixer sset Master 5%-

# Custom  class binds
bind = $mainMod SHIFT, ESCAPE, exec, kitty --class bpytop sh -c 'bpytop'
bind = $mainMod SHIFT, RETURN, exec, kitty --class dropDownTerminal sh -c 'tmux new-session -A -s dropdown'
