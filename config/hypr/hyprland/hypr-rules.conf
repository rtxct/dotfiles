# Rules
windowrulev2 = suppressevent maximize, class:.*

windowrulev2 = float, class:^(org\.pulseaudio\.pavucontrol)$
windowrulev2 = size 30% 40%, class:^(org\.pulseaudio\.pavucontrol)$
windowrulev2 = center, class:^(org\.pulseaudio\.pavucontrol)$

windowrulev2 = float, class:^(com\.github\.wwmm\.easyeffects)$
windowrulev2 = size 20% 50%, class:^(com\.github\.wwmm\.easyeffects)$
windowrulev2 = center, class:^(com\.github\.wwmm\.easyeffects)$

windowrulev2 = float, class:^(bpytop)$
windowrulev2 = size 70% 70%, class:^(bpytop)$
windowrulev2 = center, class:^(bpytop)$
windowrulev2 = animation slide 10%, class:^(bpytop)$

windowrulev2 = float, class:^(dropDownTerminal)$
windowrulev2 = size 70% 70%, class:^(dropDownTerminal)$
windowrulev2 = move 15% 5%, class:^(dropDownTerminal)$
windowrulev2 = animation slide 10%, class:^(dropDownTerminal)$
