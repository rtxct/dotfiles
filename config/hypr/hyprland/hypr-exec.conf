# Autostart
  # Status bar
# exec-once = waybar

  # Screen locking timer
exec-once = ~/.config/swayidle/config

  # Power notify
exec-once = ~/.config/hypr/scripts/power_notify

  # Notification Pop-Up
exec-once = swaync

  # Authentication Agent
exec-once = systemctl --user start hyprpolkitagent 

  # Wallpaper
exec-once = hyprpaper

  # Clipboard history
exec-once = wl-paste --watch cliphist store

  # Screen Temperature
exec-once = wlsunset -l -23.564244  -L -46.653287 -t 4000 -T 6500

  # Screen sharing
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = ./scripts/screen-share-render.sh

  # gnome-keyring-daemon
exec-once = eval $(gnome-keyring-daemon --start --components=secrets,pkcs11,ssh,gpg)

  # Nwg-look mouse setting
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Bibata-Modern-Ice'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = hyprctl setcursor Bibata-Modern-Ice 24 
